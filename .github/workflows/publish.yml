name: Batch Publish - IMAK
on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST
  push:
    branches: [main]
    paths: ['publish.js', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imak-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node publish.js

      - name: Commit and push
        run: |
          git config user.name "IMAK Publisher Bot"
          git config user.email "filmtabela@gmail.com"
          git add published.json blog.html blog/
          git diff --staged --quiet || git commit -m "Published: $(date +'%Y-%m-%d %H:%M')"
          git push origin HEAD:main

      - name: Deploy blog to Hostinger
        env:
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          sudo apt-get install -y sshpass >/dev/null
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          REMOTE=u114546712@145.79.209.26
          ROOT=/home/u114546712/domains/imakinc.com/public_html
          sshpass -p "$SSH_PASS" ssh $OPTS -p 65002 $REMOTE "mkdir -p $ROOT/blog"
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 blog/*.html $REMOTE:$ROOT/blog/
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 blog.html $REMOTE:$ROOT/blog.html
          sshpass -p "$SSH_PASS" ssh $OPTS -p 65002 $REMOTE "cp $ROOT/blog.html $ROOT/blog/index.html"
          echo "Deploy complete"
