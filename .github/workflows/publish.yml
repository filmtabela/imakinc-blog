name: Batch Publish - IMAK
on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: echo "No npm dependencies required"
      - name: Run publish script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node publish.js
      - name: Commit and push
        run: |
          git config user.name "IMAK Publisher Bot"
          git config user.email "filmtabela@gmail.com"
          git add .
          git diff --staged --quiet || git commit -m "Batch publish: $(date +'%Y-%m-%d %H:%M')"
          git push origin
